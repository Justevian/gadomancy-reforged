plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.28-alpha+1.21.1'
group = 'makeo.gadomancy'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
}

dependencies {
    implementation files('libs/thaumcraft-4-reforged-1.1.3-1.21.1.jar')
    // Optional coexistence check; Gadomancy does not require Thaumic Bases.
    if (file('libs/thaumicbases-0.1.54-alpha+1.21.1.jar').isFile()) {
        runtimeOnly files('libs/thaumicbases-0.1.54-alpha+1.21.1.jar')
    }
    runtimeOnly files('libs/TerraBlender-neoforge-1.21.1-4.1.0.1.jar', 'libs/curios-neoforge-9.5.1+1.21.1.jar')
}

neoForge {
    version = '21.1.256'
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        gadomancy { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000'] }

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
}
neoForge.mods.gadomancy.sourceSet(sourceSets.smoke)
neoForge.runs.server.systemProperty('gadomancy.smoke', providers.gradleProperty('portSmoke').orElse('false').get())
neoForge.runs.client.systemProperty('gadomancy.clientSmoke', providers.gradleProperty('clientSmoke').orElse('false').get())
tasks.named('runServer') { standardInput = System.in }

tasks.named('runServer') {
    doLast {
        if (providers.gradleProperty('portSmoke').orElse('false').get().toBoolean()) {
            def log = file('run/logs/latest.log').text
            if (!log.contains('GAD_PORT_SMOKE_PASSED') || log.contains('GAD_PORT_SMOKE_FAILED')) {
                throw new GradleException('Gadomancy integration checks did not pass; inspect run/logs/latest.log')
            }
        }
    }
}

tasks.named('runClient') {
    doLast {
        if (providers.gradleProperty('clientSmoke').orElse('false').get().toBoolean()) {
            def log = file('run/logs/latest.log').text
            if (!log.contains('GAD_CLIENT_SMOKE_PASSED') || log.contains('GAD_CLIENT_SMOKE_FAILED')) {
                throw new GradleException('Gadomancy client checks did not pass; inspect run/logs/latest.log')
            }
        }
    }
}
